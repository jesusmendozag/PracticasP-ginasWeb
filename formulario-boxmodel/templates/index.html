<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Formulario y Box Model</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="form-container">
        <h2>Registro de Usuario</h2>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Ana García">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="mensaje">Comentarios:</label>
                <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Enviar Registro</button>
        </form>
    </main>
</body>
</html>
